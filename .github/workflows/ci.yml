name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust reference tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Types, formula parser, validator, and the differential sample tests.
      - name: cargo test
        run: cargo test

      # The committed JSON Schema must match what the types generate — otherwise
      # someone changed the types without regenerating it, and the schema is a lie.
      - name: JSON Schema is up to date with the types
        run: |
          cargo run --quiet --bin gen-schema > ../schema/ronu-module.schema.json
          if ! git -C .. diff --exit-code -- schema/ronu-module.schema.json; then
            echo "::error::schema/ronu-module.schema.json is stale — regenerate: cargo run --bin gen-schema > ../schema/ronu-module.schema.json"
            exit 1
          fi

      # The reference validator must accept every sample.
      - name: Reference validator accepts every sample
        run: cargo run --quiet --bin ronu -- validate ../samples/*/module.json

  wasm:
    name: wasm binding compiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Proves the validator still compiles to wasm for JS/TS consumers.
      - run: cargo build --target wasm32-unknown-unknown

  schema:
    name: JSON Schema + real .ronu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The structural contract, checkable in any language.
      - name: Samples validate against the JSON Schema
        run: >-
          npx -y ajv-cli@5 validate --spec=draft7 --strict=false
          -s schema/ronu-module.schema.json -d "samples/*/module.json"

      # The bundled sample is a real .ronu: it must unzip to its members.
      - name: Real .ronu unpacks
        run: |
          unzip -l samples/hello-ronu/hello.ronu
          unzip -p samples/hello-ronu/hello.ronu module.json > /dev/null

  player:
    name: Reference player
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The player's engine must walk every sample to its end, pass every
      # operator and fallback test, and open the real .ronu through the same
      # unzip path the UI uses. No npm install: Node's built-in runner only.
      - name: node --test
        run: node --test player/test/*.test.mjs
